name: mcp-riskmap
description: Static MCP and agent-tool repository risk scanner with SARIF output.
author: mcp-riskmap contributors
branding:
  icon: shield
  color: gray-dark

inputs:
  path:
    description: Repository path to scan.
    required: false
    default: .
  format:
    description: Report format: table, json, markdown, or sarif.
    required: false
    default: sarif
  output:
    description: Output file path. Leave empty to print to stdout.
    required: false
    default: mcp-riskmap.sarif
  fail-on:
    description: Fail when a finding is at or above this severity.
    required: false
    default: ""
  profile:
    description: Common fail policy: local, audit, ci, or release. Ignored when fail-on is set.
    required: false
    default: ""
  baseline:
    description: Baseline JSON file used to report only findings that are not already reviewed.
    required: false
    default: ""
  exclude:
    description: Newline-separated relative path globs to exclude.
    required: false
    default: ""
  python-version:
    description: Python version used to run mcp-riskmap.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - shell: bash
      run: |
        set -euo pipefail

        args=(scan "${{ inputs.path }}" --format "${{ inputs.format }}")

        if [ -n "${{ inputs.output }}" ]; then
          args+=(--output "${{ inputs.output }}")
        fi

        if [ -n "${{ inputs.fail-on }}" ]; then
          args+=(--fail-on "${{ inputs.fail-on }}")
        fi

        if [ -n "${{ inputs.profile }}" ]; then
          args+=(--profile "${{ inputs.profile }}")
        fi

        if [ -n "${{ inputs.baseline }}" ]; then
          args+=(--baseline "${{ inputs.baseline }}")
        fi

        while IFS= read -r pattern; do
          if [ -n "$pattern" ]; then
            args+=(--exclude "$pattern")
          fi
        done <<< "${{ inputs.exclude }}"

        mcp-riskmap "${args[@]}"
